site_name: pyCHM
site_description: Open Composite Higgs Model calculator -- potential, spectrum, fine-tuning, constraints
site_url: https://murnanedaniel.github.io/pyCHM/
repo_url: https://github.com/murnanedaniel/pyCHM
repo_name: murnanedaniel/pyCHM
docs_dir: docs

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - toc.follow

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_root_heading: true
            show_source: true
            members_order: source
            separate_signature: true

markdown_extensions:
  - admonition
  - footnotes
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Tutorial: tutorial.md
  - Physics:
      - Models: models.md
      - Coset landscape: COSET_LANDSCAPE.md
  - Mathematics:
      - The Coset(G,H) engine: engine.md
      - Derivations: DERIVATIONS.md
  - Validation:
      - Thesis validation: THESIS_VALIDATION.md
      - Validation audit: VALIDATION_AUDIT.md
  - Extending pyCHM: EXTENDING_BSM.md
  - API reference:
      - Model & top-level: api/model.md
      - Potential & spectrum: api/spectrum.md
      - Fine-tuning: api/tuning.md
      - Constraints: api/constraints.md
      - The group engine: api/groups.md
